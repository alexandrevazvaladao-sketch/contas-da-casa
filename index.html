function parcelasDoMes(ym){var out=[];S.parcelas.forEach(function(p){var d=ymDiff(p.mes,ym),n=(+p.atual||1)+d;if(d>=0&&n>=1&&n<=p.total&&(p.adiantadas||[]).indexOf(ym)<0)out.push(Object.assign({},p,{n:n}))});return out}

/* ---------- previsão automática dos próximos meses ----------
   Todo mês sem plano próprio repete o último mês planejado (como as colunas da planilha):
   contas fixas, mercado/iFood/extras, salários e o total dos cartões sem parcelas cadastradas.
   Nos cartões com parcelas, entram as parcelas reais de cada mês. */
function planejado(x){return x.orig==='planilha'||x.orig==='previsao'}
function mesModelo(ym){var ks=Object.keys(S.months).filter(function(k){return k<ym&&monthLanc(k).some(planejado)}).sort();return ks.length?ks[ks.length-1]:null}
function virtuais(ym){
  var atual=monthLanc(ym),tem={};atual.forEach(function(x){tem[x.desc]=1});
  var out=[];
  if(!atual.some(planejado)){
    var k=mesModelo(ym);
    if(k){var comParc={};S.parcelas.forEach(function(p){comParc[p.fonte]=1});
      monthLanc(k).filter(function(x){return planejado(x)&&!x.naoRepete&&x.tipo!=='investimento'&&!(x.cat==='Fatura cartão'&&comParc[x.fonte])})
        .forEach(function(x){out.push(Object.assign({},x,{id:'v'+ym+x.id,virt:true,prev:x.tipo!=='receita',pago:false,venc:''}));tem[x.desc]=1})}
  }
  // contas marcadas "repetir todo mês" lançadas à mão: repete a mais recente de cada nome
  Object.keys(S.months).filter(function(k){return k<ym&&k>=INICIO}).sort().reverse().forEach(function(k){
    monthLanc(k).forEach(function(x){if(x.fixa&&!x.naoRepete&&!planejado(x)&&x.orig!=='fatura'&&!tem[x.desc]){tem[x.desc]=1;out.push(Object.assign({},x,{id:'v'+ym+x.id,virt:true,prev:x.tipo==='despesa',pago:false,venc:''}))}})});
  return out;
}
function materializa(ym){var V=virtuais(ym);if(!V.length)return {};var mapa={},novos=V.map(function(x){var y=Object.assign({},x,{id:uid(),orig:'previsao'});delete y.virt;mapa[x.id]=y.id;return y});setMonth(ym,monthLanc(ym).concat(novos));return mapa}
/* ---------- guardado (reserva) ----------
   S.config.guardado = valor guardado antes de dezembro/2026 (informado por vocês).
   Investimentos lançados nos meses entram no guardado. Acumulado do caixa começa em INICIO. */
function guardadoBase(){return +((S.config.guardado||{}).valor)||0}
/* Resultado do mês = entra − sai − o que vocês separaram para guardar.
   Guardado disponível no começo do mês = valor inicial + tudo que foi separado nos meses anteriores
   − o que já foi usado para cobrir meses negativos. "Com o guardado" = resultado + guardado disponível. */
function fluxo(ym){
  var G=guardadoBase(),out=null;
  for(var m=INICIO;m<=ym;m=ymAdd(m,1)){
    var c=calc(m),res=Math.round((c.R-c.D-c.I)*100)/100,r={res:res,G:G,com:Math.round((res+G)*100)/100,I:c.I,c:c};
    if(m===ym){out=r;break}
    G=Math.round(Math.max(0,G+c.I+Math.min(0,res))*100)/100;
  }
  return out||{res:0,G:G,com:G,I:0,c:calc(ym)};
}
function linhaGuardado(ym){

  return h('div',{class:'cmp',style:'display:flex;justify-content:space-between;margin-top:8px;font-size:15px'},

/* ---------- Ajustar para não ficar negativo ----------
   Mostra os gastos que dá para mexer (previstos) e sugere cortes até o mês fechar no zero
   contando o guardado. Ordem: o que dói menos primeiro, respeitando um mínimo realista. */
// O que dá para mexer: comer fora, pedir comida, lazer/extras, mercado e um pouco da energia.
// Parcelas, contas fixas, cartões, IA (trabalho) e água ficam como estão. Número negativo = corte máximo em R$.
var AJUSTE=[['Restaurante/Lazer',0],['Ifood/Delivery',0],['Gastos extras',100],['Compras online',0],['Carne',50],['Supermercado',900],['Energia',-60]];
function ajustaveis(ym){
  var ord={};AJUSTE.forEach(function(a,i){ord[a[0]]=i});
  return calc(ym).all.filter(function(x){return x.prev&&x.tipo==='despesa'&&ord[x.cat]!=null&&(+x.valor||0)>=20&&(x.cat!=='Fatura cartão'||!S.parcelas.some(function(p){return p.fonte===x.fonte}))})
    .sort(function(a,b){return ord[a.cat]-ord[b.cat]});
}
function sugereCortes(ym,falta){ // divide o corte entre todos, proporcional ao que cada um ainda pode baixar
  var piso={};AJUSTE.forEach(function(a){piso[a[0]]=a[1]});
  var L=ajustaveis(ym).map(function(x){var base=Math.round((+x.valor+(+x.usado||0))*100)/100,p=piso[x.cat]||0,minimo=p<0?base+p:p;return {x:x,base:base,pode:Math.max(0,base-Math.max(minimo,+x.usado||0))}});
  var tot=L.reduce(function(a,r){return a+r.pode},0),fr=tot>0?Math.min(1,falta/tot):0,cortado=0;
  L.forEach(function(r){var c=Math.min(r.pode,Math.ceil(r.pode*fr/10)*10);r.novo=Math.round((r.base-c)*100)/100;cortado+=c});
  return L;
}
function corteNecessario(ym){ // corte mensal igual em ym e nos meses negativos seguintes para o guardado nunca ficar negativo
  var f=fluxo(ym),D=[-f.res],m=ym;for(var i=0;i<5;i++){m=ymAdd(m,1);var r=fluxo(m).res;if(r>=-0.5)break;D.push(-r)}
  var acc=0,X=0;D.forEach(function(d,j){acc+=d;X=Math.max(X,(acc-f.G)/(j+1))});return {X:Math.max(0,Math.ceil(X)),meses:D.length};
}
function abreAjuste(ym){

    lista.append(h('div',{class:'row',style:'min-height:52px'},h('div',{class:'ic',style:'background:var(--chip)'},r.x.cat==='Fatura cartão'?'💳':icon(r.x.cat)),h('div',{class:'grow'},h('div',{class:'t'},nome),h('div',{class:'s'},'hoje '+brlRaw(r.base))),inp))});
  function calcula(){var corte=0;L.forEach(function(r,i){corte+=r.base-parseVal(inps[i].value)});var fica=f.com+corte;
    info.innerHTML='';info.append(h('div',null,'Cortando ',h('b',null,brlRaw(corte)),' por mês, '+mes+' fica com ',h('b',{style:'color:'+(fica<-0.5?'var(--bad)':'var(--ok)')},brlRaw(fica)),' contando o guardado.'))}
  calcula();
  var fProx=h('input',{type:'checkbox'});fProx.checked=true;
  sheet([h('h2',null,'✂️ Ajustar '+mes),
    h('div',{class:'hint'},falta>0?(cn.meses>1?'De '+mes+' em diante, '+cn.meses+' meses ficam negativos. Cortando uns '+brlRaw(falta)+' por mês (e usando o guardado), nenhum deles fica no vermelho. ':'Hoje '+mes+' fica '+brlRaw(f.com)+'. ')+'Sugeri cortes só no que dá para mexer (mercado, comer fora, delivery, lazer/extras e um pouco da energia). Mude os valores como quiser.':mes.charAt(0).toUpperCase()+mes.slice(1)+' já fecha positivo. Se quiser, ajuste para sobrar mais.'),
    info,lista,

    h('div',{class:'foot'},h('button',{class:'b',onclick:function(){

      setMonth(ym,monthLanc(ym).map(function(y){return novos[y.id]?Object.assign({},y,{valor:novos[y.id].v}):y}));
      if(fProx.checked){var porDesc={};Object.keys(novos).forEach(function(id){porDesc[novos[id].desc]=novos[id].v});
        Object.keys(S.months).filter(function(k){return k>ym}).forEach(function(k){var L2=monthLanc(k),mud=false;L2=L2.map(function(y){if(y.prev&&porDesc[y.desc]!=null&&y.valor!==porDesc[y.desc]){mud=true;return Object.assign({},y,{valor:porDesc[y.desc]})}return y});if(mud)setMonth(k,L2)})}
      vib();closeSheet();toast('Ajustado.');render()}},'Aplicar'))]);
}
function idGuardar(ym){return 'guardar-'+ym}
function trechoNegativo(ym){ // meses seguintes que ficam negativos em sequência (até 6)
  var out=[],m=ymAdd(ym,1);for(var i=0;i<6;i++,m=ymAdd(m,1)){var r=fluxo(m).res;if(r>=-0.5)break;out.push({m:m,def:-r})}return out;
}
function sugestaoGuardar(ym){ // quanto separar neste mês para os meses negativos seguintes não ficarem no vermelho
  var jaI=sum(calc(ym).all.filter(function(x){return x.tipo==='investimento'&&x.id===idGuardar(ym)})),f=fluxo(ym),sobra=f.res+jaI;
  var T=trechoNegativo(ym);if(!T.length)return 0;
  var G0=fluxo(ymAdd(ym,1)).G-jaI,need=T.reduce(function(a,t){return a+t.def},0)-G0;
  return Math.max(0,Math.round(Math.min(need,Math.max(0,sobra))*100)/100);
}

function calc(ym){
  var L=monthLanc(ym).concat(virtuais(ym));
  var imp={};L.forEach(function(x){if(x.orig==='fatura')imp[x.fonte]=1});
  var tot={};L.forEach(function(x){if(x.prev&&x.cat==='Fatura cartão')tot[x.fonte]=1});   // total previsto do cartão já inclui as parcelas
  var proj=parcelasDoMes(ym).filter(function(p){return !imp[p.fonte]&&!tot[p.fonte]}).map(function(p){return {id:'p'+p.id,pid:p.id,desc:p.desc+' ('+p.n+'/'+p.total+')',valor:p.valor,tipo:'despesa',cat:'Parcelas',fonte:p.fonte,pessoa:p.pessoa,proj:true,pago:false}});
  L=L.filter(function(x){return !(x.prev&&imp[x.fonte])});   // previsto some quando a fatura daquele cartão chega
  var real={};L.forEach(function(x){if(!x.prev&&x.tipo==='despesa'&&x.orig!=='fatura'&&x.orig!=='planilha'&&!x.adiant&&x.cat!=='Parcelas'&&x.cat!=='Fatura cartão')real[x.cat]=(real[x.cat]||0)+(+x.valor||0)});

   Tudo que foi no cartão vira UMA linha "Fatura <cartão>" (é o que vocês pagam de fato).
   Boletos/Pix aparecem um por um. O dia de vencimento fica guardado e vale para todo mês. */
function ehCartao(f){return !!f&&!/boleto|pix/i.test(f)}
function diaVenc(chave){return +((S.config.vencDia||{})[chave])||0}
function dataVenc(ym,dia){if(!dia)return '';var p=ym.split('-').map(Number),ult=new Date(p[0],p[1],0).getDate();return ym+'-'+String(Math.min(dia,ult)).padStart(2,'0')}
function contasAPagar(ym){
  var c=calc(ym),cart={},out=[],pagas=(S.config.faturasPagas||{});
  c.all.filter(function(x){return x.tipo==='despesa'}).forEach(function(x){
    if(ehCartao(x.fonte)){var k=x.fonte;if(!cart[k]){cart[k]={cartao:k,desc:'Fatura '+k,valor:0,n:0,prev:true};out.push(cart[k])}cart[k].valor+=+x.valor||0;cart[k].n++;if(!x.prev)cart[k].prev=false}
    else{var nome=(x.desc||'').replace(/ \(previsto\)$/,'');out.push({item:x,desc:nome,valor:+x.valor||0,prev:!!x.prev,chave:nome})}
  });
  out.forEach(function(r){
    if(r.cartao){r.chave='fatura:'+r.cartao;r.pago=!!pagas[ym+'|'+r.cartao]}else r.pago=!!r.item.pago;
    r.venc=(r.item&&r.item.venc)||dataVenc(ym,diaVenc(r.chave));
  });
  return out;
}
function diasAte(d){var a=new Date(today()+'T12:00:00'),b=new Date(d+'T12:00:00');return Math.round((b-a)/864e5)}

  var L=contasAPagar(S.ym),pend=L.filter(function(r){return !r.pago}),pagos=L.filter(function(r){return r.pago});

    prox?h('div',{class:'cmp'},'Próxima: '+prox.desc+' · dia '+(+prox.venc.slice(8))+' · '+brl(prox.valor)):h('div',{class:'cmp'},'Toque numa conta para colocar o dia do vencimento.')));

}

function dPlus(d){var p=d.split('-').map(Number);var x=new Date(Date.UTC(p[0],p[1]-1,p[2]+1));return x.toISOString().slice(0,10)}
function criarLembretes(list){
  var feitos=[],i=0;
  function fim(err){
    if(feitos.length){var porMes={};feitos.forEach(function(x){(porMes[x._ym]=porMes[x._ym]||{})[x.id]=1});
      Object.keys(porMes).forEach(function(ym){setMonth(ym,monthLanc(ym).map(function(y){return porMes[ym][y.id]?Object.assign({},y,{lembrete:true}):y}))})}
    var msg=feitos.length?feitos.length+' lembrete(s) criados no Google Agenda ✓':'';
    if(err){var c=err&&err.code;var why=c==='server_not_connected'?'Conecte o Google Agenda em claude.ai → Configurações → Conectores.':c==='needs_reauth'?'Reconecte o Google Agenda em claude.ai → Configurações → Conectores.':(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')?'Permissão ao Google Agenda não foi dada.':'O Google Agenda não respondeu. Tente de novo.';msg=(msg?msg+' · ':'')+why}
    toast(msg);render();
  }
  function next(){
    if(i>=list.length)return fim();
    var x=list[i++];
    mcp.callTool('Google Calendar','create_event',{summary:'💸 Pagar: '+(x.desc||x.cat||'conta')+' · '+brlRaw(x.valor),description:'Lembrete criado pelo app Contas da Casa.'+(x.fonte?' Pagar por: '+x.fonte+'.':''),allDay:true,startTime:x.venc+'T00:00:00',endTime:dPlus(x.venc)+'T00:00:00',overrideReminders:[{method:'popup',minutes:900}]})
      .then(function(){feitos.push(x);next()},function(e){fim(e)});
  }
  next();
}

    var i=0;

      return model.generateContent(parts).then(function(res){var t=res.response.text();var m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t)},function(e){

        if(/app.?check|appCheck|attestation/i.test(msg))throw {code:'app_check',message:msg};if(/not found|404|not supported|unsupported model/i.test(msg)&&++i<GEMINI_MODELS.length)return tenta();
        if(/api has not been used|disabled|PERMISSION_DENIED|firebasevertexai|AI Logic/i.test(msg))throw {code:'ai_off'};
        if(/quota|429|RESOURCE_EXHAUSTED/i.test(msg))throw {code:'rate_limited'};throw {code:'upstream_error',message:msg}});

var ROTAS={mercado:['mercado',''],inicio:['inicio',''],extrato:['extrato',''],pagar:['pagar',''],parcelas:['mais','parcelas'],fatura:['mais','fatura'],boleto:['mais','boletos'],acerto:['mais','pessoas']};
function rota(){var hsh=(location.hash||'').slice(1);if(hsh==='novo'){if(liberado())openForm(null);else S.pendNovo=true;return}var r=ROTAS[hsh];if(r){S.tab=r[0];S.sub=r[1];render()}}
function goMonth(n){S.ym=ymAdd(S.ym,n);vib();render()}
function init(){
  $('#eye').onclick=function(){S.hide=!S.hide;pref('hide',S.hide);render()};
  $('#menu').onclick=function(){S.tab='mais';S.sub='';render();window.scrollTo(0,0)};
  S.hide=!!pref('hide');S.last=pref('last')||{};var lm=pref('merc');if(lm&&lm.itens)S.merc=lm;
  var sx=null,sy=null;var mn=$('#view');
  mn.addEventListener('touchstart',function(e){if(e.target.closest('.chips.scroll,input,textarea,select'))return sx=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  mn.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>80&&Math.abs(dy)<50&&(S.tab!=='mais'||!S.sub))goMonth(dx<0?1:-1);sx=null},{passive:true});
  window.addEventListener('hashchange',rota);rota();
  render();
  if(FBMODE){initFirebase();return}
  var use=function(n){return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(function(){return null}):Promise.resolve(null)};
  use('mcp').then(function(m){mcp=m||null;softRender()});
  use('sample').then(function(sm){sampleApi=sm||null;if(!sm)return;Promise.resolve(sm.limits()).then(function(l){sampleImg=(l&&l.images)||false;softRender()}).catch(function(){})});
  Promise.all([use('db'),use('user')]).then(function(r){
    db=r[0]||null;userApi=r[1]||null;S.booting=false;
    if(!db){loadLocal();S.loaded=true;render();return}
    Promise.all([userApi?Promise.resolve(userApi.id()).catch(function(){return null}):null,userApi?Promise.resolve(userApi.isOwner()).catch(function(){return false}):false]).then(function(x){
      S.me=x[0]||null;S.owner=!!x[1];
      db.doc('acesso/membros').onSnapshot(function(s){
        var ids=s.exists?(s.data().ids||[]):[];
        if(S.owner&&S.me&&ids.indexOf(S.me)<0&&!s.metadata.fromCache){ids=ids.concat([S.me]);save('acesso/membros',{ids:ids})}
        S.membros=ids;S.gateReady=true;loadNames(ids);softRender();
      },function(){S.membros=[];S.gateReady=true;render()});
      if(S.owner)db.collection('pedidos').onSnapshot(function(q){S.pedidos=q.docs.map(function(d){return d.id}).filter(function(id){return (S.membros||[]).indexOf(id)<0});loadNames(S.pedidos);softRender()},function(){});
      else if(S.me)db.doc('pedidos/'+S.me).onSnapshot(function(s){S.meuPedido=s.exists;softRender()},function(){});
      setTimeout(function(){if(!S.gateReady){S.gateReady=true;S.membros=S.membros||[];render()}},10000);
    });
    startSubs();
  }).catch(function(){db=null;loadLocal();S.loaded=true;render()});
}
var subsOff=[];
function startSubs(){
  subsOff.forEach(function(f){try{f()}catch(e){}});subsOff=[];
  var lim=setTimeout(function(){if(!S.loaded)toast('Demorando para conectar. Os dados podem estar desatualizados.')},10000);
  function done(){S.loaded=true;clearTimeout(lim);updateHeader();processaAuto()}
  subsOff.push(db.doc('casa/config').onSnapshot(function(s){if(s.exists){S.config=mergeCfg(s.data())}softRender()},function(){}));
  subsOff.push(db.doc('mercado/atual').onSnapshot(function(s){if(!s.exists)return;var r=s.data();if((r.upd||0)>(S.merc.upd||0)){S.merc={itens:r.itens||[],limite:r.limite||0,upd:r.upd||0,loja:r.loja,dataNota:r.dataNota};pref('merc',S.merc);softRender()}
    else if((S.merc.upd||0)>(r.upd||0)&&!s.metadata.hasPendingWrites)save('mercado/atual',S.merc)},function(){}));
  subsOff.push(db.collection('inbox').onSnapshot(function(q){if(!S.loaded)return;q.docs.forEach(function(d){var r=d.data()||{};if(lancarAuto({valor:r.valor,desc:r.desc,cartao:r.cartao,quando:r.quando,id:'i'+d.id}))try{db.doc('inbox/'+d.id).delete()}catch(e){}})},function(){}));
  subsOff.push(db.doc('casa/parcelas').onSnapshot(function(s){S.parcelas=s.exists?(s.data().itens||[]):[];softRender()},function(){}));
  subsOff.push(db.collection('meses').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=d.data()});S.months=m;S.offline=!!q.metadata.fromCache;if(!q.metadata.fromCache)done();softRender()},function(){done()}));
}
/* ---------- Firebase ---------- */
function fsWrap(fs){
  function map(p){return p==='casa/config'?'contas/config':p==='casa/parcelas'?'contas/parcelas':p==='mercado/atual'?'contas/mercado':p==='meses'?'contasMeses':p.indexOf('meses/')===0?'contasMeses/'+p.slice(6):p==='inbox'?'contasInbox':p.indexOf('inbox/')===0?'contasInbox/'+p.slice(6):p}
  return {doc:function(p){return fs.doc(map(p))},collection:function(p){return fs.collection(map(p))}};
}
function initFirebase(){
  try{firebase.initializeApp(window.FB_CONFIG)}catch(e){}
  fbAuth=firebase.auth();var fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  fbAuth.getRedirectResult().catch(function(){});
  window.addEventListener('online',function(){S.offline=false;updateHeader()});window.addEventListener('offline',function(){S.offline=true;updateHeader()});
  fbAuth.onAuthStateChanged(function(u){
    S.fbUser=u||null;S.booting=false;
    if(!u){S.fbOk=false;db=null;subsOff.forEach(function(f){try{f()}catch(e){}});subsOff=[];render();return}
    S.fbOk=null;render();
    // A regra do Firebase decide: se a conta não for do casal, a leitura é recusada.
    fs.doc('contas/acesso').get().then(function(){S.fbOk=true;S.me=u.uid;S.membros=[u.uid];S.gateReady=true;db=fsWrap(fs);startSubs();render()},
      function(e){if(e&&e.code==='permission-denied'){S.fbOk=false}else{S.fbOk=true;S.me=u.uid;S.membros=[u.uid];S.gateReady=true;db=fsWrap(fs);startSubs()}render()});
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(reg){try{reg.update()}catch(e){}}).catch(function(){});
  }
}
/* ---------- Atualização automática (igual ao Diário de Obra) ---------- */
(function(){
  var INTERVALO_MS=60000,verificando=false,recarregando=false;
  try{var a=JSON.parse(localStorage.getItem('cc-aviso-atualizacao')||'null');
    if(a&&Date.now()-(a.quando||0)<120000){localStorage.removeItem('cc-aviso-atualizacao');setTimeout(function(){toast('App atualizado para '+(a.para||APP_VERSION)+' ✓')},800)}}catch(e){}
  try{if(/[?&]v=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  function ocupado(){
    var el=document.activeElement,tag=el&&(el.tagName||'').toLowerCase();
    if(tag==='textarea'||tag==='select'||(tag==='input'&&['button','checkbox','radio','submit','range','file'].indexOf((el.type||'').toLowerCase())<0))return true;
    if($('#modal')&&$('#modal').children.length)return true;   // formulário aberto
    if(S.entry)return true;                                     // valor sendo digitado no Mercado
    if(S.lendoNota)return true;
    return false;
  }
  function recarregar(nova){
    if(recarregando)return;recarregando=true;
    try{pref('merc',S.merc);persistLocal()}catch(e){}           // garante cópia local antes de recarregar
    try{localStorage.setItem('cc-aviso-atualizacao',JSON.stringify({de:APP_VERSION,para:nova,quando:Date.now()}))}catch(e){}
    (function ir(){if(ocupado()){setTimeout(ir,3000);return}
      window.location.replace(location.pathname+'?v='+encodeURIComponent(nova)+location.hash)})();
  }
  function verificar(){
    if(verificando||recarregando||!navigator.onLine||typeof fetch!=='function')return;verificando=true;
    fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(txt){
      var m=txt&&txt.match(/const APP_VERSION = '([^']+)'/);
      if(!m||m[1]===APP_VERSION){try{sessionStorage.removeItem('cc-tentou')}catch(e){}return}
      var t=null;try{t=sessionStorage.getItem('cc-tentou')}catch(e){}
      if(t===m[1])return;                                       // evita laço se o servidor ainda não propagou
      try{sessionStorage.setItem('cc-tentou',m[1])}catch(e){}
      recarregar(m[1]);
    }).catch(function(){}).then(function(){verificando=false});
  }
  if(!FBMODE)return;                                           // só na versão publicada no GitHub
  setTimeout(verificar,3000);setInterval(verificar,INTERVALO_MS);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')verificar()});
  window.addEventListener('focus',verificar);window.addEventListener('online',verificar);window.addEventListener('pageshow',verificar);
})();
init();
})();
</script>
